[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osml-jupyter"
dynamic = ["version"]
requires-python = ">=3.9"
dependencies = [
    "osml-imagery-toolkit~=2.0.0a1",
    "osml-imagery-io~=0.1",
]

[tool.hatch.version]
source = "env"
variable = "OSML_KERNEL_VERSION"

[tool.hatch.build.targets.wheel]
packages = ["aws"]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
]
