name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (tag, branch, or SHA) to build and publish'
        required: true
        default: 'v0.1.0'

permissions:
  contents: read

jobs:
  jlpm:
    uses: ./.github/workflows/jlpm.yml
    secrets: inherit

  publish:
    needs: [jlpm]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: '0'
          lfs: 'true'

      - name: JupyterLab Base Setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

      - name: Install JupyterLab
        run: python -m pip install -U "jupyterlab>=4.0.0,<5"

      - name: Build Package
        run: |
          python -m pip install build
          python -m build

      - uses: pypa/gh-action-pypi-publish@v1.13.0
