# OPTIONAL: Pre-provisioned kernel environment for air-gapped or managed deployments.
#
# This environment is NOT required for standard usage. The OSML JupyterLab extension
# self-bootstraps into any Python kernel that has pip and PyPI access. On first use,
# it automatically installs osml-imagery-toolkit, osml-imagery-io, and the embedded
# osml-kernel wheel — no manual environment setup needed.
#
# Use this file when:
#   - Your kernel environment cannot reach PyPI (air-gapped networks)
#   - You want to pre-provision kernel dependencies for faster first-use startup
#   - Your organization manages conda environments centrally
#
# To build the environment:
#   conda env create -f osml-kernel-environment.yml
#
# To register with Jupyter:
#   conda activate osml-kernel
#   python3 -m ipykernel install --user --name=osml-kernel
#
# After registering, refresh the JupyterLab tab to see the new kernel option.

name: osml-kernel
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12.9
  - ipykernel
  - python-graphviz
  - geopandas
  - pip
  - pip:
      - boto3
      - tqdm
      - ipyleaflet
      - osml-imagery-toolkit>=2.0.0a1
      - h3
